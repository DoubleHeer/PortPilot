name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install rumps py2app
      - name: Build .app
        run: python setup.py py2app
      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - dist/PortPilot.app
      - name: Zip
        run: cd dist && ditto -c -k --keepParent PortPilot.app PortPilot-macOS.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/PortPilot-macOS.zip
          generate_release_notes: true
